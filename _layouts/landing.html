<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.name }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.author }}">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="{{ site.url }}{{ page.url }}">

    <meta property="og:title" content="{{ page.title | default: site.name }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="{{ site.url }}{{ site.avatar }}">
    <meta property="og:image:alt" content="Portrait of {{ site.author }}">
    <meta property="profile:first_name" content="Oleg">
    <meta property="profile:last_name" content="Posyniak">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.title | default: site.name }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.avatar }}">
    <meta name="twitter:image:alt" content="Portrait of {{ site.author }}">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "{{ site.author }}",
        "url": "{{ site.url }}/",
        "image": "{{ site.url }}{{ site.avatar }}",
        "description": "{{ site.description }}",
        "jobTitle": "Engineering leader",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Austin",
          "addressRegion": "Texas",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://www.linkedin.com/in/{{ site.footer-links.linkedin }}/",
          "https://github.com/{{ site.footer-links.github }}"
        ]
      }
    </script>

    {% include landing-styles.html %}
    <meta name="theme-color" content="#0F172A">
    {% include favicons.html %}
    {% include analytics_head.html %}
  </head>
  <body class="landing-page">
    {{ content }}
  </body>
</html>
