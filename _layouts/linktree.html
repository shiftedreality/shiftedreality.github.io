<!DOCTYPE html>
<html>
  <head>
    <title>{{ page.title }}</title>
    {% include meta.html %}
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/style.css" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />
    <meta name="theme-color" content="#0F172A">
    {% include favicons.html %}
    {% include analytics_head.html %}
  </head>

  <body class="linktree-body">
    <div class="linktree-page">
      <div class="linktree-card">
        <div class="linktree-avatar"><img src="{{ site.baseurl }}/images/icon.png" alt="{{ page.title }}" /></div>
        <h1 class="linktree-name">{{ page.title }}</h1>
        <p class="linktree-bio">{{ page.bio }}</p>

        <div class="linktree-links">
          {% for link in page.links %}
          <a class="linktree-link" href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a>
          {% endfor %}
        </div>

        <p class="linktree-footer"><a href="{{ site.baseurl }}/">&larr; Back to {{ site.name }}</a></p>
      </div>
    </div>
  </body>
</html>
