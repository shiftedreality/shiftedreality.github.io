{% if site.google_analytics_ga4 %}
<script>
  (function () {
    var loaded = false;

    function loadAnalytics() {
      if (loaded) return;
      loaded = true;

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', '{{ site.google_analytics_ga4 }}');

      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_ga4 }}';
      document.head.appendChild(script);
    }

    ['pointerdown', 'keydown'].forEach(function (eventName) {
      window.addEventListener(eventName, loadAnalytics, { once: true, passive: true });
    });
    window.setTimeout(loadAnalytics, 8000);
  }());
</script>
{% endif %}
